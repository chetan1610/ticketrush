spring.application.name=notification-service
server.port=${PORT:8004}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/notifications}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dev: point at Mailpit (docker compose) - UI on http://localhost:8025
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
notification.from=${MAIL_FROM:tickets@ticketrush.local}

ticketrush.catalog-url=${CATALOG_URL:http://127.0.0.1:8001}
ticketrush.internal-token=${INTERNAL_TOKEN:dev-internal-token}
