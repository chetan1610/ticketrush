spring.application.name=payment-service
server.port=${PORT:8003}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/payments}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

ticketrush.jwt-secret=${JWT_SECRET:dev-jwt-secret-please-change-0123456789}
ticketrush.internal-token=${INTERNAL_TOKEN:dev-internal-token}
ticketrush.booking-url=${BOOKING_URL:http://127.0.0.1:8002}
ticketrush.notification-url=${NOTIFICATION_URL:http://127.0.0.1:8004}
